name: watchlist-sync

services:
  watchlist-sync:
    build:
      context: ${WATCHLIST_SYNC_BUILD_CONTEXT:-..}
      dockerfile: docker/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SYNC_INTERVAL_SEC: ${SYNC_INTERVAL_SEC:-30}
      WATCHLIST_GRACE_SEC: ${WATCHLIST_GRACE_SEC:-60}
      SCRYER_URL: ${SCRYER_URL:?Set SCRYER_URL}
      SCRYER_API_KEY: ${SCRYER_API_KEY:?Set SCRYER_API_KEY}
    volumes:
      - state:/config
    restart: unless-stopped
    stop_grace_period: 1m

volumes:
  state:
