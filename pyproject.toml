[project]
name = "watchlist-sync"
version = "0.1.0"
description = "Personal Plex and Trakt watchlist requests and monitoring through Scryer."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PlexAPI>=4.18.2,<5",
    "PyJWT[crypto]>=2.13,<3",
    "requests>=2.34,<3",
    "pydantic-settings>=2.13,<3",
    "pydantic>=2.13,<3",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "RUF"]
